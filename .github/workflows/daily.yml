name: daily

# Runs the criteria of the pinned dpp-criteria commit (DPP_CRITERIA_REF):
# every day against the operator entries (in full) and their example
# passports (dpplint), on Mondays also against the entries from our research
# (read-only, or in full on our own short-lived test instances, see
# test-instances/) and their example passports. Rates DPP-ID-002 of the
# example passports from the stored runs, keeps the JSON results on the
# branch "results" (runs/<date>/ and latest/) and publishes the result pages
# and available-services.json on GitHub Pages.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Also run the weekly checks of the entries from our research"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the image with the pinned dpp-criteria commit
        run: ./build.sh

      - name: Test suite
        run: docker run --rm oydeu/dpp-validator:latest test

      - name: Check out the stored results
        run: |
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git fetch origin results
            git worktree add history origin/results
            git -C history switch -C results
          else
            git worktree add --orphan -b results history
          fi
          mkdir -p history/runs

      - name: Daily checks of the operator entries
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/app/out" -v "$PWD/history:/app/history:ro" oydeu/dpp-validator:latest \
            cycle --cadence daily --output out --history history/runs
          ls -lR out

      - name: Weekly checks of the entries from our research (Mondays)
        if: github.event_name == 'workflow_dispatch' && inputs.weekly || github.event_name == 'schedule'
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "not Monday, weekly checks skipped"
            exit 0
          fi
          docker network inspect dpp-validator-test >/dev/null 2>&1 || docker network create dpp-validator-test
          mkdir -p test-instance-info
          for id in $(docker run --rm oydeu/dpp-validator:latest services --test-instances); do
            "test-instances/$id/instance.sh" start "test-instance-info/$id.json" || echo "::warning::test instance $id did not start"
          done
          docker run --rm --network dpp-validator-test -v "$PWD/out:/app/out" -v "$PWD/test-instance-info:/app/test-instance-info" \
            -v "$PWD/history:/app/history:ro" \
            oydeu/dpp-validator:latest cycle --cadence weekly --output out --test-instances test-instance-info --history history/runs
          ls -lR out

      - name: Discard the test instances
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.weekly || github.event_name == 'schedule')
        run: |
          for script in test-instances/*/instance.sh; do
            "$script" stop || true
          done

      - name: Keep the results on the branch results
        run: |
          date=$(date -u +%F)
          mkdir -p "history/runs/$date/linter" history/latest/linter
          cp out/*.json "history/runs/$date/"
          cp out/*.json history/latest/
          if ls out/linter/*.json >/dev/null 2>&1; then
            cp out/linter/*.json "history/runs/$date/linter/"
            cp out/linter/*.json history/latest/linter/
          fi
          cd history
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Results of $date" || echo "no changes"
          git push origin results

      - name: Build the result pages
        run: |
          mkdir -p site
          docker run --rm -v "$PWD/history:/app/history" -v "$PWD/site:/app/site" oydeu/dpp-validator:latest \
            site --results history/latest --output site --this-service ownyourdata-dpp-service

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
